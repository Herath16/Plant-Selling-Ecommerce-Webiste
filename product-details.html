<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Product Detail | CHOCO-CHOCO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <section class="product-detail-page" style="padding-top: 10rem;">
        <h1 class="heading"> Product <span>Details</span> </h1>

        <div class="product-info-container" id="single-product-info">
            <p>Loading product...</p>
        </div>

        <h2 class="heading" style="margin-top: 4rem;"> Customer <span>Reviews</span> </h2>
        
        <div class="review-form-container" style="padding: 2rem; border: 1px solid #ccc; margin-bottom: 2rem;">
            <h3>Write Your Review</h3>
            <form id="add-review-form">
                <input type="hidden" name="product_id" id="review-product-id">
                
                <div style="margin-bottom: 1rem;">
                    <label for="review-rating">Rating (1-5):</label>
                    <select id="review-rating" required style="padding: 0.5rem; border: 1px solid var(--green);">
                        <option value="5">⭐⭐⭐⭐⭐</option>
                        <option value="4">⭐⭐⭐⭐</option>
                        <option value="3">⭐⭐⭐</option>
                        <option value="2">⭐⭐</option>
                        <option value="1">⭐</option>
                    </select>
                </div>

                <input type="text" id="review-title" placeholder="Review Title" required class="input" style="width: 100%; margin-bottom: 1rem;">
                <textarea id="review-text" placeholder="Your detailed review..." required class="input" style="width: 100%; height: 100px; margin-bottom: 1rem;"></textarea>
                <button type="submit" class="btn">Submit Review</button>
            </form>
        </div>

        <div class="reviews-thread-container" id="reviews-list-container">
            <p>No reviews yet. Be the first!</p>
        </div>
    </section>

    <script src="./js/script.js"></script> <script src="./js/product-detail.js" defer></script> </body>
</html>
